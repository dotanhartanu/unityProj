# nginx.conf - Frontend reverse proxy configuration
#
# Serves two purposes:
# 1. Serve static files (HTML, CSS, JS) - leveraging nginx's optimization for static content
# 2. Reverse proxy API calls to the web-server service
#
# Benefits of using nginx for static content:
# - Fast static file serving with caching and compression
# - Separation of concerns from API logic
# - Easy integration with CDN and custom caching headers

# Run as non-root user for security
user nginx;

# Auto-detect number of CPU cores
worker_processes auto;

# Error log location
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # Max concurrent connections per worker
    # Note: Default is 1024, can increase for high traffic
    worker_connections 1024;
}

http {
    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;           # Efficient file transfer
    tcp_nopush on;         # Send headers in one packet
    tcp_nodelay on;        # Don't buffer data
    keepalive_timeout 65;  # Keep connections alive

    # Gzip compression
    # Note: Reduces bandwidth, faster page loads
    # Trade-off: slight CPU cost for compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml+rss;

    server {
        # Listen on port 80 (HTTP)
        listen 80;
        server_name _;  # Accept any hostname

        # Root directory for static files
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        # Note: Important for production!
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Serve static files
        location / {
            try_files $uri $uri/ /index.html;

            # Cache static assets
            # Note: Browsers cache for 1 hour
            # For production, use versioned URLs and longer cache times
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }

        # Proxy API calls to web-server service
        # Note: All /api/* requests go to the FastAPI backend
        # This is transparent to the frontend - single origin, no CORS issues
        location /api/ {
            # Remove /api prefix when proxying
            # /api/buy -> web-server:8000/buy
            rewrite ^/api(/.*)$ $1 break;

            # Proxy to web-server service
            # Note: In K8s, services are accessible via DNS
            # Format: <service-name>.<namespace>.svc.cluster.local:<port>
            # Short form works within same namespace: <service-name>:<port>
            proxy_pass http://web-server:8000;

            # Proxy headers
            # Note: Preserve original client info
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            # Note: If backend is slow, don't wait forever
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Don't cache API responses
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Health check endpoint (for K8s probes)
        location /health {
            access_log off;  # Don't log health checks
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
