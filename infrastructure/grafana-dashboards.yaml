# Grafana Dashboard ConfigMaps
# These ConfigMaps contain pre-configured dashboards for monitoring the purchase system
#
# Dashboards are in JSON format and will be automatically loaded by Grafana
# when the sidecar is enabled in the Helm values

---
apiVersion: v1
kind: ConfigMap
