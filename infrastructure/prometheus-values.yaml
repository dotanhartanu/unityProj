# Prometheus Stack Helm Values
# Using kube-prometheus-stack chart which includes:
# - Prometheus Operator
# - Prometheus server
# - Alertmanager
# - node-exporter (node metrics)
# - kube-state-metrics (K8s object metrics)

# Prometheus configuration
prometheus:
  prometheusSpec:
    # ServiceMonitor selector - monitors services with this label
    # Using empty selector to discover all ServiceMonitors in all namespaces
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}

    # Scrape interval
    scrapeInterval: 30s

    # Retention period for metrics
    retention: 7d

    # Resource limits
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 1000m
        memory: 4Gi

    # Storage configuration
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

# Grafana is installed separately with its own values
# Disable the bundled Grafana
grafana:
  enabled: false

# Alertmanager configuration
# NOTE: Alertmanager is enabled but no alert rules are configured
# Consider disabling (enabled: false) to save resources, or add alert rules
alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

# node-exporter - collects node-level metrics
prometheus-node-exporter:
  enabled: true

# kube-state-metrics - collects K8s object metrics
kube-state-metrics:
  enabled: true
