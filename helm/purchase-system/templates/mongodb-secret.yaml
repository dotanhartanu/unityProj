# MongoDB Secret - Stores MongoDB credentials
#
# Note: In production, use:
# - External secret managers (Vault, AWS Secrets Manager, etc.)
# - Sealed Secrets or External Secrets Operator
# - Pass password via --set at helm install time
#
# Current approach demonstrates proper secret management pattern
# without hardcoding credentials in values.yaml

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mongodb-secret
  labels:
    {{- include "purchase-system.labels" . | nindent 4 }}
type: Opaque
stringData:
  # MongoDB credentials
  # Note: These are base64-encoded when stored in Kubernetes
  mongodb-username: admin
  mongodb-password: {{ .Values.mongodb.password | default "password" }}

  # Full connection string with credentials
  # Used by management-api to connect to MongoDB
  mongodb-uri: "mongodb://admin:{{ .Values.mongodb.password | default "password" }}@mongodb-0.mongodb-svc.mongodb.svc.cluster.local:27017/?directConnection=true&authSource=admin"
